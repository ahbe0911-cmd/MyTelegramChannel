plugins { id 'com.android.application' }

def apiBaseUrl = (project.findProperty("API_BASE_URL") ?: "https://REPLACE_ME.workers.dev").toString()

android {
    namespace 'ir.example.mychannel'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.example.mychannel'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrl.replace('\\', '\\\\').replace('"', '\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
